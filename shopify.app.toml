# Shopify App CLI Configuration Manifest
# Learn more at: https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "858c4c20dbdd7d4e00d0caab447f3fec"
name = "conversion-suite"
handle = "aya-conversion-suite"
application_url = "https://shopify-conversion-suite-peach.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = "aya-store-b729lzvt.myshopify.com"

[access_scopes]
# Required permissions for discounts, orders, products, and analytics
scopes = "read_products,write_products,read_orders,write_discounts,read_discounts,write_app_proxy"

[auth]
redirect_urls = [
  "https://shopify-conversion-suite-peach.vercel.app/auth/callback",
  "https://shopify-conversion-suite-peach.vercel.app/auth/shopify/callback"
]

[webhooks]
api_version = "2025-01"

  # Disabled until Protected Customer Data access is approved in Dev Dashboard:
  # [[webhooks.subscriptions]]
  # topics = [ "orders/paid" ]
  # uri = "/webhooks/orders-paid"

[app_proxy]
url = "https://shopify-conversion-suite-peach.vercel.app/api"
prefix = "apps"
subpath = "conversion-suite"
